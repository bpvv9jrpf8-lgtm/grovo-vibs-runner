name: Grovo Vibs Ready Download

on:
  workflow_run:
    workflows: ['Grovo Vibs Build Package']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Grovo Vibs Build Package run ID to reuse'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: grovo-vibs-ready-download
  cancel-in-progress: false

jobs:
  prepare-download:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve source build run
        id: source
        shell: bash
        env:
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then RUN_ID="$AUTO_RUN_ID"; else RUN_ID="$MANUAL_RUN_ID"; fi
          [ -n "$RUN_ID" ] || { echo 'Source run id missing'; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact saved build package
        uses: actions/download-artifact@v4
        with:
          name: grovo-vibs-package-${{ steps.source.outputs.run_id }}
          path: grovo-vibs-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate ready files
        run: |
          set -euo pipefail
          test -s grovo-vibs-package/output/grovo_vibs_stock_video.mp4
          test -s grovo-vibs-package/output/youtube_thumbnail.jpg
          test -s grovo-vibs-package/output/youtube_packaging.json
          mkdir -p ready-download
          cp grovo-vibs-package/output/grovo_vibs_stock_video.mp4 ready-download/
          cp grovo-vibs-package/output/youtube_thumbnail.jpg ready-download/
          cp grovo-vibs-package/output/youtube_packaging.json ready-download/

      - name: Save ready video download
        uses: actions/upload-artifact@v4
        with:
          name: GROVO-VIBS-READY-${{ steps.source.outputs.run_id }}
          path: ready-download/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
