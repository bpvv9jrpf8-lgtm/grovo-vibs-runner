name: Grovo Vibs Generate Song

on:
  workflow_dispatch:
  schedule:
    # 4 songs/week: Sunday, Monday, Wednesday, Friday at 14:00 UTC.
    - cron: '0 14 * * 0,1,3,5'

permissions:
  contents: read
  actions: write

concurrency:
  group: grovo-vibs-generate-song
  cancel-in-progress: false

jobs:
  generate-song:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Validate paid-generation secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN OPENAI_API_KEY ELEVENLABS_API_KEY; do
            [ -n "${!name:-}" ] || { echo "$name missing"; exit 1; }
          done

      - name: Checkout private Grovo Vibs source
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/grovo-vibs-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install Python dependencies
        run: pip install -r private-code/requirements.txt

      - name: Generate original full song ONCE
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python full_song.py

      - name: Validate paid output immediately
        working-directory: private-code
        run: |
          set -euo pipefail
          test -s output/grovo_vibs_full_song.mp3
          test -s output/full_song_plan.json
          test -s output/composition_plan.json

      - name: Save immutable paid-generation artifact
        run: |
          set -euo pipefail
          mkdir -p grovo-song-package/output
          cp private-code/output/grovo_vibs_full_song.mp3 grovo-song-package/output/
          cp private-code/output/full_song_plan.json grovo-song-package/output/
          cp private-code/output/composition_plan.json grovo-song-package/output/
          printf '{"source_run_id":"%s","stage":"paid_song_complete","template":"GROVO_VIBS_PAID_SONG_V2"}\n' "${GITHUB_RUN_ID}" > grovo-song-package/package.json

      - name: Upload immutable paid song
        uses: actions/upload-artifact@v4
        with:
          name: grovo-song-${{ github.run_id }}
          path: grovo-song-package/
          if-no-files-found: error
          retention-days: 10
