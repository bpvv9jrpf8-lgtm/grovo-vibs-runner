name: Grovo Vibs Generate Package

on:
  workflow_dispatch:
  schedule:
    # 4 songs/week: Sunday, Monday, Wednesday, Friday at 14:00 UTC.
    - cron: '0 14 * * 0,1,3,5'

permissions:
  contents: read
  actions: write

concurrency:
  group: grovo-vibs-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Validate generation secrets
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          for name in PRIVATE_REPO_TOKEN OPENAI_API_KEY ELEVENLABS_API_KEY PEXELS_API_KEY; do
            [ -n "${!name:-}" ] || { echo "$name missing"; exit 1; }
          done

      - name: Checkout private Grovo Vibs source
        uses: actions/checkout@v4
        with:
          repository: bpvv9jrpf8-lgtm/grovo-vibs-automation
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-code
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: private-code/requirements.txt

      - name: Install dependencies and FFmpeg
        run: |
          pip install -r private-code/requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate original full song once
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python full_song.py

      - name: Build mood-matched long video once
        working-directory: private-code
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python stock_video.py

      - name: Build YouTube packaging once
        working-directory: private-code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python youtube_packaging.py

      - name: Validate publish-ready package
        working-directory: private-code
        run: |
          set -euo pipefail
          test -s output/grovo_vibs_stock_video.mp4
          test -s output/full_song_plan.json
          test -s output/youtube_packaging.json
          test -s output/youtube_thumbnail.jpg
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/grovo_vibs_stock_video.mp4

      - name: Save immutable publish package
        run: |
          set -euo pipefail
          mkdir -p grovo-vibs-package/output
          cp private-code/output/grovo_vibs_stock_video.mp4 grovo-vibs-package/output/
          cp private-code/output/full_song_plan.json grovo-vibs-package/output/
          cp private-code/output/youtube_packaging.json grovo-vibs-package/output/
          cp private-code/output/youtube_thumbnail.jpg grovo-vibs-package/output/
          if [ -d private-code/output/thumbnail_variants ]; then cp -R private-code/output/thumbnail_variants grovo-vibs-package/output/; fi
          if [ -f private-code/output/stock_sources.json ]; then cp private-code/output/stock_sources.json grovo-vibs-package/output/; fi
          cp private-code/youtube_upload.py grovo-vibs-package/
          cp private-code/requirements.txt grovo-vibs-package/
          printf '{"source_run_id":"%s","template":"GROVO_VIBS_SAVED_PACKAGE_V1"}\n' "${GITHUB_RUN_ID}" > grovo-vibs-package/package.json

      - name: Upload saved package for publish-only retry
        uses: actions/upload-artifact@v4
        with:
          name: grovo-vibs-package-${{ github.run_id }}
          path: grovo-vibs-package/
          if-no-files-found: error
          retention-days: 10
